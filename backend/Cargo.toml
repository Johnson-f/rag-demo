[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
libsql = { version = "0.9", features = ["core", "replication", "remote"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
actix-web = "4"
actix-cors = "0.7"
actix-ws = "0.4"
rig-core = "0.31.0"
rig-qdrant = "0.1.37"
qdrant-client = "1.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23", default-features = false }
futures = "0.3"
