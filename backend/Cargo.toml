[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
libsql = { version = "0.9", features = ["core", "replication", "remote"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
actix-web = "4"
actix-cors = "0.7"
